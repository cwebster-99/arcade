<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot App Telemetry</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cff'/%3E%3Cpath d='M7 22l6-8 5 5 7-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar" aria-label="Navigation">
      <div class="logo" title="Copilot App Telemetry">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#7c5cff" /><path d="M7 22l6-8 5 5 7-10" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </div>
      <nav>
        <a class="nav-item active" title="Dashboards" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z" /></svg></a>
        <a class="nav-item" title="Explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" /><path d="M20 20l-4.5-4.5" /></svg></a>
        <a class="nav-item" title="Alerts"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1112 0v6l2 2H4zM10 21h4" /></svg></a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="breadcrumbs">
          <span class="crumb">Copilot App Telemetry</span>
          <span class="sep">/</span>
          <span class="crumb">Dashboards</span>
          <span class="sep">/</span>
          <h1 id="dashboard-title">Loading…</h1>
        </div>
        <div class="toolbar">
          <span class="live" id="live-indicator" title="Auto-refresh: live"><span class="dot"></span>Live</span>
          <span class="time-range" id="time-range">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
            <span id="time-range-label">Last 14 days</span>
          </span>
          <button class="icon-btn" id="refresh-btn" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.7M20 4v5h-5" /></svg>
          </button>
        </div>
      </header>

      <section class="variables" id="variables" aria-label="Dashboard variables"></section>

      <main class="grid" id="panels" aria-live="polite"></main>

      <footer class="status" id="status"></footer>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
